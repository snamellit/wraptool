project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*.md"
    - "!presentation.qmd"

website:
  title: "wraptool"
  description: "A credential boundary between AI coding environments, privileged CLI tools, and local MCP servers."
  site-url: https://pti.pages.snamellit.com/wraptool/
  repo-url: https://forge.snamellit.com/pti/wraptool
  repo-subdir: docs
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
    copy-button: true
  navbar:
    background: dark
    left:
      - href: index.qmd
        text: Home
      - text: Getting Started
        menu:
          - getting-started.qmd
          - text: "---"
          - platform-linux.qmd
          - platform-guix.qmd
          - platform-macos.qmd
          - platform-windows.qmd
      - text: Reference
        menu:
          - installation.qmd
          - configuration.qmd
          - cli-reference.qmd
          - mcp-integration.qmd
          - terminology.qmd
      - href: security.qmd
        text: Security
      - text: Operations
        menu:
          - examples.qmd
          - troubleshooting.qmd
          - hot-reload.qmd
          - web-ui.qmd
          - harness-pool.qmd
    right:
      - icon: git
        href: https://forge.snamellit.com/pti/wraptool
        aria-label: Wraptool source repository
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - section: Start
        contents:
          - getting-started.qmd
          - section: Platform setup
            contents:
              - platform-linux.qmd
              - platform-guix.qmd
              - platform-macos.qmd
              - platform-windows.qmd
          - installation.qmd
      - section: Reference
        contents:
          - configuration.qmd
          - cli-reference.qmd
          - mcp-integration.qmd
          - terminology.qmd
      - section: Trust boundary
        contents:
          - architecture.qmd
          - security.qmd
          - isolated-environments.md
          - git-hardening.qmd
          - comparison.qmd
      - section: Operate
        contents:
          - examples.qmd
          - hot-reload.qmd
          - web-ui.qmd
          - harness-pool.qmd
          - troubleshooting.qmd
      - section: Project
        contents:
          - contributing.qmd
          - releases.qmd
  page-footer:
    left: "Wraptool is GPLv3-licensed software."
    right:
      - text: Source
        href: https://forge.snamellit.com/pti/wraptool
      - text: Issues
        href: https://forge.snamellit.com/pti/wraptool/issues

format:
  html:
    theme: [darkly, wraptool.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

# Presentation slides use revealjs; declared in the file's own
# frontmatter rather than at project level so the website pages do
# not get rendered twice (once per project-level format).
