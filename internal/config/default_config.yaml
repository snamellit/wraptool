# wraptool configuration — generated default.
#
# wraptool wraps CLI tools behind a security whitelist: nothing reaches the AI
# until you allow it under `tools:`. Edits are picked up automatically (the file
# is watched) or on SIGHUP.
#
# Validate after editing:  wraptool config validate
# Docs:                    https://forge.snamellit.com/pti/wraptool

mcp:
  # Transport the MCP server listens on: sse | unix. sse (a loopback TCP listener)
  # is the default so `wraptool up` can reach the server from inside the
  # container. Use unix for a filesystem socket instead.
  transport: sse
  listen: 127.0.0.1:8717
  # Log verbosity: debug | info | warn | error.
  log_level: info
  # Auth token for a non-loopback bind (an unauthenticated non-loopback listener
  # is open to the network). `wraptool up` generates this token file for you;
  # for a direct `wraptool serve`, create it first (it must exist at config load):
  #   auth_token_file: __CONFIG_DIR__/mcp-token

# Operator review UI. NOT AI-facing — bind localhost only. `wraptool up` enables
# this automatically at 127.0.0.1:8718 with a generated token, so you do not
# need to set anything here for the standard `up` workflow. Uncomment to pick a
# different port or token file, or run `wraptool up --no-admin` to disable it.
# A direct `wraptool serve` (no `up`) does NOT auto-enable the UI — uncomment to
# turn it on, and create the token file first:
# admin:
#   listen: 127.0.0.1:8718
#   auth_token_file: __CONFIG_DIR__/admin-token

# Tools exposed to the AI. Every subcommand/flag not listed here is denied.
tools:
  # Starter example: `git pull`. wraptool earns its keep on PRIVILEGED commands —
  # `git pull` needs the network and your host credentials, which the AI never
  # sees, so it has to go through wraptool. (Read-only local git like status/log/
  # diff only touches the working .git and needs no credentials, so there is no
  # point wrapping it — the AI can run those itself.) Adapt or replace this with
  # the tools you actually want to expose.
  git:
    # Single-quoted so a Windows-style path with backslashes stays literal.
    binary: '__GIT_BINARY__'
    # Mandatory git settings, applied at COMMAND scope. Do not remove these.
    #
    # Why: wraptool runs git on the HOST, with your credentials, in a working
    # tree that the AI (and anything it builds or installs) can write to. Git
    # reads configuration from that working tree, and several settings there
    # make git execute a program:
    #   * .git/hooks/post-merge and post-checkout run on every `git pull`;
    #     `--no-verify` does NOT suppress them.
    #   * core.fsmonitor in .git/config runs on most working-tree commands.
    # Whoever writes those files would run code as you, outside the container.
    #
    # Git reads config in the order system, global, local, command. Later wins,
    # so a setting in the repository's own .git/config overrides your ~/.gitconfig
    # — a global setting cannot defend against a hostile repository. The
    # GIT_CONFIG_* variables below are COMMAND scope, which outranks .git/config.
    # core.hooksPath points git at a directory with no hooks in it (the directory
    # does not need to exist; git then simply finds nothing to run), and
    # core.fsmonitor=false stops the fsmonitor program from being launched.
    #
    # To add a setting: bump GIT_CONFIG_COUNT and add the next indexed pair.
    # Indices are 0-based and must be contiguous — with COUNT 3 git reads
    # KEY_0/VALUE_0 through KEY_2/VALUE_2. Values are literal strings; quote
    # them so YAML keeps "2" and "false" as text rather than a number or a
    # boolean. Run `wraptool config validate` after editing.
    #
    # See git-config(1), section "ENVIRONMENT VARIABLES" (GIT_CONFIG_COUNT),
    # and githooks(5):
    #   https://git-scm.com/docs/git-config
    #   https://git-scm.com/docs/githooks
    #
    # Caveat: an explicit `git -c key=value` on the command line still outranks
    # these. Never add -c, --config-env, -C, --git-dir, or --work-tree to an
    # allow rule's flags — that would hand the override back to the caller.
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: '__CONFIG_DIR__/empty-hooks'
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
    allow:
      # Both reach the network with your credentials, and neither carries any
      # flags: with no `flags:` list, only -h/--help are accepted, so there is
      # nothing for a caller to smuggle in. Add flags deliberately, one at a
      # time, and read the -c warning above before you do.
      - subcommand: [pull]
      - subcommand: [fetch]

      # `fetch` is the safer of the two. `pull` also merges and checks out,
      # which is what runs .gitattributes filter and merge drivers — and those
      # the env block above does NOT disable. The hardened profile in
      # design/git-execution-hardening.md §4 therefore replaces a host-side
      # pull with `wraptool: git fetch` followed by an ordinary `git merge`
      # inside your container, where no host credentials exist. `pull` stays
      # here because it is the obvious first thing to try; prefer fetch.

      # Pushing WRITES to the remote as you, and its effects leave your
      # machine. Uncomment deliberately. The denies are not optional: --force
      # and --force-with-lease destroy history, and --receive-pack and --exec
      # name a program for the far end to run.
      # - subcommand: [push]
      #   deny_flags: ["--force", "--force-with-lease", "--receive-pack",
      #                "--exec", "--recurse-submodules", "--signed"]

      # `clone` is deliberately absent. It is the one transport subcommand
      # where the agent chooses BOTH the remote URL and the destination path,
      # so it can reach hosts you did not intend and write a tree outside any
      # worktree. It is also where Git's clone-time CVEs live. Add it only if
      # you need it, and see design/git-execution-hardening.md first.
