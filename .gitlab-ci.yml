# GitLab Pages pipeline for the wraptool documentation site.
# The repository's canonical remote is Forgejo; this job assumes a
# mirror to GitLab. Quarto renders docs/_site -> public/ which GitLab
# Pages serves at https://<group>.gitlab.io/<project>/.

stages:
  - test
  - build
  - deploy
  - release

variables:
  QUARTO_VERSION: "1.5.57"
  # Pinned toolchain image, built from manifest.scm by the Forgejo
  # `Publish CI toolchain image` workflow. Single source of truth for both the
  # lint and the release-binary jobs so Go/git/golangci-lint versions never
  # drift between them. Repoint the tag (or a @sha256 digest) here to bump.
  CI_TOOLCHAIN_IMAGE: "forge.snamellit.com/pti/wraptool/ci-toolchain:latest"

# Go static checks: gofmt, go vet, and golangci-lint (staticcheck + exhaustive
# + the standard set, per .golangci.yml). Runs on every branch. The image is
# built from manifest.scm by the Forgejo `Publish CI toolchain image` workflow
# and pushed to the (public) Forgejo registry, so go/git/golangci-lint versions
# have a single source of truth shared with local `guix shell` development.
lint:
  stage: test
  image: $CI_TOOLCHAIN_IMAGE
  interruptible: true
  variables:
    # The image has no HOME; point Go's and golangci-lint's caches at the
    # writable project dir. CGO off — deps are pure Go, no C toolchain in image.
    GOPATH: "$CI_PROJECT_DIR/.cache/go"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci"
    CGO_ENABLED: "0"
    # Use the image's pinned Go; never silently download a toolchain. If the
    # image's Go is older than go.mod's directive this fails loudly (a signal to
    # refresh the image) instead of a flaky download that breaks gofmt/lint.
    GOTOOLCHAIN: "local"
  cache:
    key: go-lint
    paths:
      - .cache/
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    # gofmt only tracked files: `gofmt -l .` would also walk the in-project Go
    # module/toolchain cache (GOPATH is under $CI_PROJECT_DIR so GitLab can cache
    # it), and gofmt does NOT skip dot-dirs the way `go ./...` does — it would
    # then parse the downloaded stdlib testdata and fail. go vet / golangci use
    # ./... so they already skip .cache.
    - test -z "$(gofmt -l $(git ls-files '*.go'))" || { echo 'gofmt needed on:'; gofmt -l $(git ls-files '*.go'); exit 1; }
    - go vet ./...
    - golangci-lint run ./...

# Reusable build step: render docs/ into ./public.
.render: &render
  image: ghcr.io/quarto-dev/quarto:${QUARTO_VERSION}
  # Let a newer pipeline auto-cancel a superseded one still in flight.
  interruptible: true
  before_script:
    - quarto --version
  script:
    - quarto render docs --output-dir ../public
  artifacts:
    paths:
      - public

# Branch builds: render and keep artifact for review, do not publish.
docs:build:
  <<: *render
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  artifacts:
    paths:
      - public
    expire_in: 1 week

# Publish: only on the default branch (main).
pages:
  <<: *render
  stage: deploy
  # Explicitly flag this as a Pages deployment (GitLab 17.4+), rather than
  # relying on the magic "pages" job name.
  pages: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    paths:
      - public
    expire_in: 30 days

# --- Internal release of precompiled binaries ---------------------------------
# GitLab-side counterpart of the Forgejo `publish-binaries.yml`. Forgejo stays
# the canonical signing authority: the annotated tag is GPG-verified there, so
# here we only assert the tag-NAME format and trust that a `wraptool-v*` tag on
# this mirror already passed Forgejo verification. GitLab runners have no guix,
# so `guix time-machine` is dropped — the pinned ci-toolchain image (built from
# manifest.scm) IS the toolchain pin. The build cross-compiles the same six
# targets with the same ldflags version stamp, uploads every artifact to the
# project's generic package registry, then cuts a GitLab Release linking them.
# Both jobs fire only for a release tag.
.release-rules: &release-rules
  - if: $CI_COMMIT_TAG =~ /^wraptool-v/

release:binaries:
  stage: release
  image: $CI_TOOLCHAIN_IMAGE
  rules: *release-rules
  variables:
    # Same cache/toolchain posture as `lint`: no HOME in the image, pinned Go,
    # never auto-download a toolchain, CGO off (pure-Go deps).
    GOPATH: "$CI_PROJECT_DIR/.cache/go"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    CGO_ENABLED: "0"
    GOTOOLCHAIN: "local"
  script:
    # Tag-name format only — signature verification is Forgejo's job.
    - |
      printf '%s\n' "$CI_COMMIT_TAG" | grep -Eq '^wraptool-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
        || { echo "tag '$CI_COMMIT_TAG' is not a wraptool-vX.Y.Z release tag"; exit 1; }
    - version=${CI_COMMIT_TAG#wraptool-v}
    - ldflags="-X github.com/pti/wraptool/internal/buildinfo.version=$version"
    - go test ./...
    - mkdir -p dist
    - |
      for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
        goos=${target%/*}; goarch=${target#*/}
        output="dist/wraptool_${version}_${goos}_${goarch}"
        [ "$goos" = windows ] && output="${output}.exe"
        GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "$output" .
      done
    - |
      {
        echo "version=$version"
        echo "tag=$CI_COMMIT_TAG"
        echo "commit=$CI_COMMIT_SHA"
        go version
        sha256sum channels.scm manifest.scm
      } > dist/build-info.txt
    - (cd dist && sha256sum wraptool_* build-info.txt > checksums.txt)
    # Upload every artifact to the project's generic package registry.
    - |
      pkg="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}"
      for f in dist/*; do
        name=${f##*/}
        curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${pkg}/${name}"
      done
    # Hand the resolved version to the release job.
    - echo "version=$version" > release.env
  artifacts:
    paths:
      - dist
    reports:
      dotenv: release.env
    expire_in: 30 days

release:publish:
  stage: release
  # release-cli is required for the `release:` keyword. Pinned so an upstream
  # push cannot change release behaviour mid-flight. If this Melexis GitLab
  # instance cannot reach registry.gitlab.com, mirror the image internally and
  # repoint this line.
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: release:binaries
      artifacts: true
  rules: *release-rules
  script:
    - echo "Cutting GitLab release $CI_COMMIT_TAG (version $version)"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Precompiled wraptool binaries, build metadata, and SHA-256 checksums."
    assets:
      links:
        - name: "wraptool_${version}_linux_amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/wraptool_${version}_linux_amd64"
        - name: "wraptool_${version}_linux_arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/wraptool_${version}_linux_arm64"
        - name: "wraptool_${version}_darwin_amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/wraptool_${version}_darwin_amd64"
        - name: "wraptool_${version}_darwin_arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/wraptool_${version}_darwin_arm64"
        - name: "wraptool_${version}_windows_amd64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/wraptool_${version}_windows_amd64.exe"
        - name: "wraptool_${version}_windows_arm64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/wraptool_${version}_windows_arm64.exe"
        - name: "checksums.txt"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/checksums.txt"
        - name: "build-info.txt"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraptool/${version}/build-info.txt"
