name: Lint

# Go static checks: gofmt, go vet, and golangci-lint (staticcheck + exhaustive
# + the standard set, per .golangci.yml).
#
# `push` is scoped to main so a branch that has an open PR is linted exactly
# once (via pull_request), not twice — two concurrent jobs on the shared native
# runner collide on golangci-lint's host-wide lock ("another instance is
# running") and one fails. main still lints on push (no PR involved).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Native (host-mode) Guix runner, same as the publish workflow. All tools
    # come from manifest.scm, evaluated at the revisions in channels.scm, so the
    # check is reproducible regardless of the host profile.
    # (The first invocation builds the profile; Guix caches it for later steps.)
    runs-on: guix
    steps:
      - uses: actions/checkout@v4

      # One `guix shell` for all checks — resolves the profile once instead of
      # per step (a collapsed step trades per-check UI granularity for that
      # saving). `sh -e` so any check that fails — not just the last one — fails
      # the job.
      - name: gofmt + go vet + golangci-lint + go test
        run: |
          guix time-machine -C channels.scm -- shell -m manifest.scm -- sh -ec '
            export GOTOOLCHAIN=local   # use the manifest Go; never silently download a toolchain
            unformatted=$(gofmt -l $(git ls-files "*.go"))
            test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }
            go vet ./...
            golangci-lint run ./...
            go test ./...'
