name: Lint

# Go static checks on every push / PR: gofmt, go vet, and golangci-lint
# (staticcheck + exhaustive + the standard set, per .golangci.yml).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Native (host-mode) Guix runner, same as the publish workflow. All tools
    # come from manifest.scm via `guix shell` — go, git and golangci-lint are
    # pinned there, so the check is reproducible regardless of the host profile
    # and stays in lockstep with local `guix shell -m manifest.scm` development.
    # (The first invocation builds the profile; Guix caches it for later steps.)
    runs-on: guix
    steps:
      - uses: actions/checkout@v4

      # One `guix shell` for all three checks — resolves the profile once
      # instead of per step (a collapsed step trades per-check UI granularity
      # for that saving; only three fast checks, so it's worth it).
      - name: gofmt + go vet + golangci-lint
        run: |
          guix shell -m manifest.scm -- sh -c '
            unformatted=$(gofmt -l .)
            test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }
            go vet ./...
            golangci-lint run ./...'
