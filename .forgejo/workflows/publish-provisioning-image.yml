name: Publish harness-pool provisioning image

# Builds the §11.2 provisioning OCI image from images/provisioning-manifest.scm
# (node/npm, tar, xz, coreutils, bash, CA certs — the same contract as the
# guix backend's package set) for BOTH linux/amd64 and linux/arm64, and pushes
# a multi-arch MANIFEST LIST to the Forgejo registry as
# forge.snamellit.com/pti/wraptool/pool-provisioning. Apple-silicon Docker
# Desktop resolves linux/arm64 from the list; a single-arch manifest would
# hard-fail (or worse, silently Rosetta-run amd64) there.
#
# The arm64 image is cross-built on the amd64 runner with
# `guix pack --system=aarch64-linux`: package substitutes for aarch64 come
# from the configured substitute servers, so this is mostly downloads, not
# emulated compilation.
#
# The LIST digest is printed prominently at the end: cmd/harness.go pins it,
# and every npm recipe_revision folds it in (§8), so publishing a new image
# deliberately invalidates existing locks once the pin is updated.
#
# Trigger: main + manual dispatch only. The initial any-branch trigger existed
# to mint the first digest pre-merge; keeping it would let any branch push
# evaluate modified Guile on the runner with REGISTRY_TOKEN in scope and
# republish :latest. Feature branches needing a digest use workflow_dispatch.
on:
  push:
    branches: [main, feat/oci-provisioner] # TEMPORARY branch entry: mint the first multi-arch digest pre-merge (workflow_dispatch is invisible until the file reaches main); revert to main-only before merge
    paths:
      - images/provisioning-manifest.scm
      - channels.scm
      - .forgejo/workflows/publish-provisioning-image.yml
  workflow_dispatch:

jobs:
  publish:
    # Native (host-mode) Guix runner: guix-daemon present, `guix pack`
    # realizes the closures here; the resulting images need no daemon to run.
    runs-on: guix
    steps:
      - uses: actions/checkout@v4

      - name: Build per-arch images from the provisioning manifest
        run: |
          # -S /bin=bin           → /bin/sh + coreutils on PATH (npm spawns
          #                         lifecycle scripts via /bin/sh)
          # -S /usr/bin=bin       → /usr/bin/env for env-prefixed argv and
          #                         '#!/usr/bin/env node' shims
          # -S /etc/ssl/certs=... → CA bundle for the resolve phase's HTTPS
          common="-f docker -S /bin=bin -S /usr/bin=bin -S /etc/ssl/certs=etc/ssl/certs -m images/provisioning-manifest.scm"
          img_amd64=$(guix time-machine -C channels.scm -- pack $common)
          img_arm64=$(guix time-machine -C channels.scm -- pack --system=aarch64-linux $common)
          echo "IMG_AMD64=$img_amd64" >> "$GITHUB_ENV"
          echo "IMG_ARM64=$img_arm64" >> "$GITHUB_ENV"

      - name: Push per-arch images and the manifest list
        env:
          # Username must own REGISTRY_TOKEN; defaults to the dispatch actor.
          # Mirrors publish-ci-image.yml.
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          guix time-machine -C channels.scm -- shell skopeo buildah jq -- sh -ec '
            dest="forge.snamellit.com/${{ github.repository }}/pool-provisioning"
            creds="$REGISTRY_USER:$REGISTRY_TOKEN"
            sha="${GITHUB_SHA:0:12}"

            # Per-arch manifests under arch-suffixed tags. guix pack of an
            # aarch64 system emits an image whose config already declares
            # architecture arm64; skopeo preserves it.
            skopeo copy --dest-creds "$creds" "docker-archive:$IMG_AMD64" "docker://$dest:$sha-amd64"
            skopeo copy --dest-creds "$creds" "docker-archive:$IMG_ARM64" "docker://$dest:$sha-arm64"

            # Assemble and push the manifest list for :latest and :<sha>.
            buildah manifest create pool-provisioning-list
            buildah manifest add --creds "$creds" pool-provisioning-list "docker://$dest:$sha-amd64"
            buildah manifest add --creds "$creds" pool-provisioning-list "docker://$dest:$sha-arm64"
            for tag in latest "$sha"; do
              buildah manifest push --all --creds "$creds" \
                pool-provisioning-list "docker://$dest:$tag"
            done

            digest=$(skopeo inspect --raw --creds "$creds" "docker://$dest:$sha" | \
              sha256sum | cut -d" " -f1)
            arches=$(skopeo inspect --raw --creds "$creds" "docker://$dest:$sha" | \
              jq -r "[.manifests[].platform.architecture] | join(\",\")")
            echo "=============================================================="
            echo "MANIFEST LIST ARCHITECTURES: $arches"
            echo "PROVISIONING IMAGE PINNED REFERENCE (update cmd/harness.go):"
            echo "$dest@sha256:$digest"
            echo "=============================================================="
          '
