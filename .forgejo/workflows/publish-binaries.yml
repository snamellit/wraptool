name: Publish release binaries

# A wraptool release tag produces portable, statically linked binaries for the
# common desktop/server platforms and uploads them to the matching Forgejo
# release. Go cross-compiles every target on the native Guix runner.
on:
  push:
    tags:
      - 'wraptool-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed wraptool release tag to retry
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: guix
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify signed release tag
        run: |
          guix time-machine -C channels.scm -- shell git gnupg coreutils grep sed -- sh -ec '
            expected_fingerprint=C8ABC91CAB2DC195B9763877DFABC43C55F2E63A

            printf "%s\n" "$RELEASE_TAG" | grep -Eq "^wraptool-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
            # Forgejo gives checkout the peeled commit SHA, causing checkout to
            # overwrite the annotated tag ref. Restore the signed object.
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag

            export GNUPGHOME=$(mktemp -d)
            chmod 700 "$GNUPGHOME"
            trap "rm -rf \"$GNUPGHOME\"" EXIT
            fingerprint=$(gpg --batch --with-colons --import-options show-only \
              --import release-signing-key.asc 2>/dev/null | \
              grep "^fpr:" | cut -d: -f10 | sed -n "1p")
            test "$fingerprint" = "$expected_fingerprint"
            gpg --batch --import release-signing-key.asc
            if ! verify_output=$(git verify-tag --raw "$RELEASE_TAG" 2>&1); then
              printf "%s\n" "$verify_output" >&2
              exit 1
            fi
            printf "%s\n" "$verify_output"
            test "$(printf "%s\n" "$verify_output" | grep -c "^\[GNUPG:\] VALIDSIG ")" -eq 1
            valid_signature=$(printf "%s\n" "$verify_output" | grep "^\[GNUPG:\] VALIDSIG ")
            signer_primary_fingerprint=${valid_signature##* }
            test "$signer_primary_fingerprint" = "$expected_fingerprint"
            test "$(git rev-list -n1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          '

      - name: Test and build release binaries
        id: build
        run: |
          guix time-machine -C channels.scm -- shell -m manifest.scm -- sh -ec '
            export GOTOOLCHAIN=local
            export CGO_ENABLED=0
            go test ./...
            mkdir dist
            description=$(git describe --tags --match "wraptool-v[0-9]*" --exact-match)
            test "$description" = "$RELEASE_TAG"
            version=${description#wraptool-v}
            ldflags="-X github.com/pti/wraptool/internal/buildinfo.version=$version"

            for target in \
              linux/amd64 linux/arm64 \
              darwin/amd64 darwin/arm64 \
              windows/amd64 windows/arm64
            do
              goos=${target%/*}
              goarch=${target#*/}
              output="dist/wraptool_${version}_${goos}_${goarch}"
              if test "$goos" = windows; then
                output="$output.exe"
              fi

              GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$ldflags" -o "$output" .
            done

            {
              echo "version=$version"
              echo "tag=$description"
              echo "commit=$(git rev-parse HEAD)"
              go version
              sha256sum channels.scm manifest.scm
            } > dist/build-info.txt
            (cd dist && sha256sum wraptool_* build-info.txt > checksums.txt)
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          '

      # The Homebrew formula is generated from the checksums this build just
      # produced, so the tap can never point at bytes that were not released
      # together. It is uploaded as a release asset (manual `brew install
      # <url>` fallback, and an audit record of what the tap was told), and
      # pushed to the tap repository by the step below when a token exists.
      - name: Generate Homebrew formula
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          FORGEJO_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          guix time-machine -C channels.scm -- shell coreutils grep -- sh -ec '
            version="$RELEASE_VERSION"
            base="${FORGEJO_URL%/}/$REPOSITORY/releases/download/wraptool-v$version"

            asset_sha() {
              sha=$(grep "  $1$" dist/checksums.txt | cut -d " " -f 1)
              test -n "$sha"
              printf "%s" "$sha"
            }

            darwin_arm64=$(asset_sha "wraptool_${version}_darwin_arm64")
            darwin_amd64=$(asset_sha "wraptool_${version}_darwin_amd64")
            linux_arm64=$(asset_sha "wraptool_${version}_linux_arm64")
            linux_amd64=$(asset_sha "wraptool_${version}_linux_amd64")

            cat > dist/wraptool.rb <<EOF
          # Generated by .forgejo/workflows/publish-binaries.yml for
          # wraptool-v$version. Do not edit by hand; a release regenerates it.
          class Wraptool < Formula
            desc "MCP server that wraps CLI tools behind a security whitelist"
            homepage "https://pti.pages.snamellit.com/wraptool/"
            version "$version"
            license "GPL-3.0-or-later"

            on_macos do
              on_arm do
                url "$base/wraptool_${version}_darwin_arm64", using: :nounzip
                sha256 "$darwin_arm64"

                def install
                  bin.install "wraptool_#{version}_darwin_arm64" => "wraptool"
                end
              end

              on_intel do
                url "$base/wraptool_${version}_darwin_amd64", using: :nounzip
                sha256 "$darwin_amd64"

                def install
                  bin.install "wraptool_#{version}_darwin_amd64" => "wraptool"
                end
              end
            end

            on_linux do
              on_arm do
                url "$base/wraptool_${version}_linux_arm64", using: :nounzip
                sha256 "$linux_arm64"

                def install
                  bin.install "wraptool_#{version}_linux_arm64" => "wraptool"
                end
              end

              on_intel do
                url "$base/wraptool_${version}_linux_amd64", using: :nounzip
                sha256 "$linux_amd64"

                def install
                  bin.install "wraptool_#{version}_linux_amd64" => "wraptool"
                end
              end
            end

            def caveats
              <<~CAVEATS
                wraptool itself is a single static binary and needs nothing else to run
                its MCP server. Running an isolated project container (\`wraptool up\`)
                on macOS additionally needs Docker Desktop and the Dev Containers CLI:
                  https://pti.pages.snamellit.com/wraptool/platform-macos.html
              CAVEATS
            end

            test do
              assert_match "wraptool #{version}", shell_output("#{bin}/wraptool version")
            end
          end
          EOF
          '

      - name: Publish Forgejo release
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          guix time-machine -C channels.scm -- shell curl jq nss-certs coreutils -- sh -ec '
            api="${FORGEJO_URL%/}/api/v1/repos/$REPOSITORY"
            auth="Authorization: token $FORGEJO_TOKEN"

            if ! release=$(curl --silent --show-error --fail \
              --header "$auth" "$api/releases/tags/$RELEASE_TAG"); then
              payload=$(jq -n \
                --arg tag "$RELEASE_TAG" \
                --arg sha "$RELEASE_COMMIT" \
                --arg body "Precompiled wraptool binaries, build metadata, and SHA-256 checksums. Release notes: CHANGELOG.md at this tag." \
                "{tag_name: \$tag, target_commitish: \$sha, name: \$tag, body: \$body, draft: false, prerelease: false}")
              release=$(curl --silent --show-error --fail-with-body \
                --request POST --header "$auth" --header "Content-Type: application/json" \
                --data "$payload" "$api/releases")
            fi
            release_id=$(printf "%s\n" "$release" | jq -er ".id")

            assets=$(curl --silent --show-error --fail --header "$auth" \
              "$api/releases/$release_id/assets")
            for asset in dist/*; do
              name=${asset##*/}
              existing_id=$(printf "%s\n" "$assets" | jq -r --arg name "$name" \
                "first(.[] | select(.name == \$name) | .id) // empty")
              if test -n "$existing_id"; then
                curl --silent --show-error --fail --request DELETE --header "$auth" \
                  "$api/releases/$release_id/assets/$existing_id"
              fi
              curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors \
                --request POST --header "$auth" --header "Content-Type: application/octet-stream" \
                --data-binary "@$asset" "$api/releases/$release_id/assets?name=$name" \
                >/dev/null
            done
          '

      # Homebrew installs and upgrades from a tap repository, not from the
      # release API, so the formula has to be committed after the assets exist.
      # The tap lives in its own repository (pti/homebrew-wraptool) because
      # `brew tap` clones a whole repo named homebrew-<tap>; a token for it is
      # therefore a separate secret. Without that secret the step is a no-op —
      # the formula is still attached to the release and can be committed by
      # hand — so a fork or a repository that has never set up a tap still
      # publishes binaries successfully.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'pti/homebrew-wraptool' }}
          FORGEJO_URL: ${{ github.server_url }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
        run: |
          if test -z "$TAP_TOKEN"; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping tap update." >&2
            exit 0
          fi
          guix time-machine -C channels.scm -- shell git nss-certs coreutils -- sh -ec '
            host=${FORGEJO_URL#https://}
            host=${host%/}
            checkout=$(mktemp -d)
            trap "rm -rf \"$checkout\"" EXIT

            # The token is only ever in the remote URL of a throwaway clone,
            # never in the repository this job checked out. git echoes the
            # remote URL verbatim in its errors, so both network commands
            # discard stderr and report failure themselves.
            if ! git clone --quiet --depth 1 \
              "https://wraptool-ci:$TAP_TOKEN@$host/$TAP_REPOSITORY.git" "$checkout" 2>/dev/null
            then
              echo "Cannot clone tap $TAP_REPOSITORY (missing repository or token scope)." >&2
              exit 1
            fi

            mkdir -p "$checkout/Formula"
            cp dist/wraptool.rb "$checkout/Formula/wraptool.rb"

            cd "$checkout"
            # Stage first: on the first release into a fresh tap the formula is
            # untracked, and an unstaged diff would report no change at all.
            git add Formula/wraptool.rb
            if git diff --cached --quiet -- Formula/wraptool.rb; then
              echo "Formula already up to date for $RELEASE_TAG."
              exit 0
            fi
            git -c user.name="wraptool release" -c user.email="pti@snamellit.com" \
              commit --quiet -m "wraptool $RELEASE_VERSION"
            if ! git push --quiet origin HEAD 2>/dev/null; then
              echo "Cannot push the formula to $TAP_REPOSITORY (token lacks write access?)." >&2
              exit 1
            fi
          '
