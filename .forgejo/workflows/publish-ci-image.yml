name: Publish CI toolchain image

# Builds an OCI image from manifest.scm (the flat toolchain: go + git +
# golangci-lint + node + a shell/coreutils/CA-certs) and pushes it to the
# Forgejo registry as forge.snamellit.com/pti/wraptool/ci-toolchain.
# Docker-executor CI that can't run Guix natively (GitLab) consumes this image,
# so manifest.scm stays the single source of truth for the pinned toolchain.
#
# Path-filtered on the manifest and channel lock: dormant on ordinary pushes,
# rebuilding only when the toolchain definition or package revisions change.
on:
  push:
    branches: [main]
    paths:
      - manifest.scm
      - channels.scm
  workflow_dispatch:

jobs:
  publish:
    # Native (host-mode) Guix runner: guix-daemon is present, so `guix pack`
    # realizes the closure here. The resulting image needs no daemon to run.
    runs-on: guix
    steps:
      - uses: actions/checkout@v4

      - name: Build image from manifest
        run: |
          # -S /bin=bin              → /bin/sh + coreutils on PATH for the runner
          # -S /etc/ssl/certs=...    → CA bundle where Go looks by default (HTTPS
          #                            module fetches), verified in podman.
          img=$(guix time-machine -C channels.scm -- pack -f docker \
                  -S /bin=bin -S /etc/ssl/certs=etc/ssl/certs \
                  -m manifest.scm)
          echo "IMG=$img" >> "$GITHUB_ENV"

      - name: Push to Forgejo registry
        env:
          # Username must own REGISTRY_TOKEN; defaults to the dispatch actor.
          # Set a REGISTRY_TOKEN secret (write:package) if the automatic token
          # lacks package:write. Mirrors publish-feature.yml.
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # One `guix shell` wrapping the loop → skopeo profile resolved once,
          # not per tag. Push :latest and the short commit sha (blobs dedup by
          # digest, so the second tag reuses the first's upload).
          guix time-machine -C channels.scm -- shell skopeo -- sh -c '
            dest="forge.snamellit.com/${{ github.repository }}/ci-toolchain"
            for tag in latest "${GITHUB_SHA:0:12}"; do
              skopeo copy --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
                docker-archive:"$IMG" "docker://$dest:$tag"
            done'
