name: Publish dev container feature

# Publishes the wraptool Dev Container Features under features/src/ to the Forgejo
# OCI registry as forge.snamellit.com/pti/wraptool/<feature-id>: `wraptool` (the
# wiring-only feature, major :1 — the harness binary comes from the host's
# shared harness-pool runtime/ mount, not this feature). `devcontainer features
# publish ./features/src` handles every feature in the dir; each is tagged from
# the `version` in its own devcontainer-feature.json (:X, :X.Y, :X.Y.Z, :latest).
#
# The older `wraptool-connect` feature's source was retired (folded into the
# merged `wraptool` feature); its already-published registry artifacts (:0,
# 0.1.x) keep working — nothing here republishes them. features/src/wraptool-connect/
# now holds only a README.md tombstone (no devcontainer-feature.json, so the
# published artifacts' documentationURL — a directory link — has somewhere to
# land instead of 404ing): `devcontainer features publish` warns and skips
# any features/src/ subdirectory missing devcontainer-feature.json rather
# than erroring, so the tombstone is inert to this workflow.
#
# Application release tags republish the current feature versions:
#   ./release-version patch
# To release only a feature, bump its devcontainer-feature.json version and push
# a matching feature tag, or run this workflow manually.
on:
  push:
    tags:
      - 'wraptool-v*'
  workflow_dispatch:

jobs:
  publish:
    # Native (host-mode) Guix runner: runs directly on the host, no per-job
    # container — avoids the act-in-docker networking/tar-copy issues. The job is
    # docker-less (auth written to ~/.docker/config.json; publish pushes over
    # HTTP), so it needs only node/npm/git.
    runs-on: guix
    steps:
      - uses: actions/checkout@v4

      # Fail fast if a feature is broken.
      - name: Test features
        run: |
          sh features/test/wraptool/selftest.sh

      - name: Install devcontainers CLI
        run: |
          # Install to a writable homedir prefix (avoids a root-owned global dir
          # on a host runner) and expose the bin dir to later steps.
          export npm_config_prefix="$HOME/.npm-global"
          mkdir -p "$npm_config_prefix"
          npm install -g @devcontainers/cli
          echo "$npm_config_prefix/bin" >> "$GITHUB_PATH"

      # Auth for the OCI registry, written directly to the docker config so no
      # docker CLI/daemon is needed. The automatic token is tried first; if it
      # lacks package:write, create a repo/org secret REGISTRY_TOKEN (a Forgejo
      # access token with write:package) and it will be used instead.
      - name: Configure registry auth
        env:
          # Username must own REGISTRY_TOKEN. Defaults to the dispatch actor;
          # set a REGISTRY_USER secret if the token belongs to another account.
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 -w0)
          printf '{"auths":{"forge.snamellit.com":{"auth":"%s"}}}\n' "$auth" \
            > "$HOME/.docker/config.json"

      - name: Publish
        run: |
          devcontainer features publish ./features/src \
            --namespace "${{ github.repository }}" \
            --registry forge.snamellit.com
